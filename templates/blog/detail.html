{% extends 'base.html' %}
{% load markdown_extras %}
{% block title %}{{ post.title }} | Blog{% endblock %}
{% block content %}
<main>
  <section class="page-title">
    <div class="container">
      <p class="eyebrow">Blog · {{ post.published_at|date:"d M Y" }}</p>
      <h1>{{ post.title }}</h1>
      <p class="lead">{{ post.excerpt }}</p>
    </div>
  </section>
  <section class="content">
    <div class="container">
      <article class="card">
        <div class="meta" style="margin-top:0;"><span>{{ post.cover_label }}</span><span><a href="/blog/">Volver al blog</a></span></div>
        <div class="post-body">{{ post.content|markdownify }}</div>
      </article>
    </div>
  </section>
</main>
{% endblock %}
